# Sobe Postgres + servidor.  Antes:  ./gradlew :server:buildFatJar   e   cp .env.example .env
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cvforge
      POSTGRES_USER: cvforge
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvforge"]
      interval: 5s
      retries: 10
    ports: ["5432:5432"]

  server:
    build: ./server
    depends_on:
      db: { condition: service_healthy }
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: jdbc:postgresql://db:5432/cvforge
      DATABASE_USER: cvforge
      DATABASE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODELS: ${GROQ_MODELS:-openai/gpt-oss-120b,openai/gpt-oss-20b,qwen/qwen3.8-27b}
      CORS_HOSTS: ${CORS_HOSTS:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports: ["8080:8080"]

volumes:
  pgdata:
